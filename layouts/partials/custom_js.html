<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7CqxKSqPzumLNTDzGvlP2iVqmHJ8hifc",
    authDomain: "em-lab-fisica-ronald.firebaseapp.com",
    projectId: "em-lab-fisica-ronald",
    storageBucket: "em-lab-fisica-ronald.firebasestorage.app",
    messagingSenderId: "692250974747",
    appId: "1:692250974747:web:98a40ed8b938f4daf436be"
  };

  const app = initializeApp(firebaseConfig);
  window.emlabAuth = getAuth(app);
  window.emlabDB = getFirestore(app);
</script>

<style>
  #emlab-nav-item {
    display: flex;
    align-items: center;
    margin-right: 8px;
  }
  #emlab-auth-widget-inner {
    display: flex;
    align-items: center;
    font-size: 14px;
    white-space: nowrap;
  }
  #emlab-auth-widget-inner span {
    margin-right: 8px;
  }
  #emlab-auth-widget-inner button {
    background: transparent;
    color: inherit;
    border: 1.5px solid currentColor;
    padding: 4px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  #emlab-auth-widget-inner button:hover {
    background: rgba(0,0,0,0.08);
  }
  @media (max-width: 576px) {
    #emlab-auth-widget-inner span { display: none; }
  }
  #emlab-modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 10000;
    align-items: center;
    justify-content: center;
  }
  #emlab-modal {
    background: white;
    color: #222;
    padding: 24px;
    border-radius: 10px;
    width: 280px;
    font-family: sans-serif;
  }
  #emlab-modal input {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
    box-sizing: border-box;
  }
  #emlab-modal button { margin-top: 8px; width: 100%; }
  #emlab-error { color: red; font-size: 12px; min-height: 16px; }
</style>

<div id="emlab-modal-bg">
  <div id="emlab-modal">
    <h4 id="emlab-modal-title">Ingresar</h4>
    <input id="emlab-email" type="email" placeholder="Correo">
    <input id="emlab-pass" type="password" placeholder="Contraseña">
    <div id="emlab-error"></div>
    <button onclick="emlabDoAuth()" id="emlab-submit-btn">Ingresar</button>
    <p style="font-size:12px;text-align:center;margin-top:8px;">
      <a href="#" onclick="emlabToggleMode(event)" id="emlab-toggle-link">¿No tienes cuenta? Regístrate</a>
    </p>
    <p style="text-align:center;"><a href="#" onclick="emlabCloseModal(event)">Cerrar</a></p>
  </div>
</div>

<script type="module">
  import { onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { doc, getDoc, setDoc }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  let modoRegistro = false;
  window.emlabAuthUser = undefined; // undefined = aún no se sabe, null = sin sesión, objeto = con sesión

  window.emlabGuardarProgresoNube = function(progresoObj){
    if (!window.emlabAuthUser) return Promise.resolve();
    return setDoc(doc(window.emlabDB, 'usuarios', window.emlabAuthUser.uid), {
      progreso: progresoObj,
      actualizado: Date.now()
    }, { merge: true }).catch(function(err){ console.warn('No se pudo guardar en la nube:', err); });
  };

  window.emlabLeerProgresoNube = function(){
    if (!window.emlabAuthUser) return Promise.resolve({});
    return getDoc(doc(window.emlabDB, 'usuarios', window.emlabAuthUser.uid)).then(function(snap){
      return snap.exists() ? (snap.data().progreso || {}) : {};
    }).catch(function(){ return {}; });
  };

  function emlabMontarWidget(){
    if (document.getElementById('emlab-nav-item')) return true;
    const ul = document.querySelector('ul.nav-icons');
    if (!ul) return false;
    const li = document.createElement('li');
    li.className = 'nav-item';
    li.id = 'emlab-nav-item';
    li.innerHTML = '<span id="emlab-auth-widget-inner"></span>';
    ul.insertBefore(li, ul.firstChild);
    return true;
  }

  function emlabAsegurarWidget(intentos){
    if (emlabMontarWidget()) { pintarWidget(window.emlabAuthUser); return; }
    if (intentos > 0) setTimeout(function(){ emlabAsegurarWidget(intentos - 1); }, 200);
  }

  window.emlabOpenModal = function(registro){
    modoRegistro = registro;
    document.getElementById('emlab-modal-title').textContent = registro ? 'Crear cuenta' : 'Ingresar';
    document.getElementById('emlab-submit-btn').textContent = registro ? 'Crear cuenta' : 'Ingresar';
    document.getElementById('emlab-toggle-link').textContent = registro ? '¿Ya tienes cuenta? Ingresa' : '¿No tienes cuenta? Regístrate';
    document.getElementById('emlab-error').textContent = '';
    document.getElementById('emlab-modal-bg').style.display = 'flex';
  };
  window.emlabCloseModal = function(e){ e.preventDefault(); document.getElementById('emlab-modal-bg').style.display = 'none'; };
  window.emlabToggleMode = function(e){ e.preventDefault(); window.emlabOpenModal(!modoRegistro); };

  window.emlabDoAuth = function(){
    const email = document.getElementById('emlab-email').value.trim();
    const pass = document.getElementById('emlab-pass').value;
    const errorBox = document.getElementById('emlab-error');
    errorBox.textContent = '';
    const accion = modoRegistro
      ? createUserWithEmailAndPassword(window.emlabAuth, email, pass)
      : signInWithEmailAndPassword(window.emlabAuth, email, pass);
    accion
      .then(() => { document.getElementById('emlab-modal-bg').style.display = 'none'; })
      .catch((err) => { errorBox.textContent = emlabTraducirError(err.code); });
  };

  window.emlabLogout = function(){ signOut(window.emlabAuth); };

  function emlabTraducirError(code){
    const mapa = {
      'auth/invalid-email': 'Correo inválido.',
      'auth/email-already-in-use': 'Ese correo ya tiene una cuenta.',
      'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
      'auth/invalid-credential': 'Correo o contraseña incorrectos.',
      'auth/missing-password': 'Escribe una contraseña.'
    };
    return mapa[code] || 'Ocurrió un error, intenta de nuevo.';
  }

  function pintarWidget(user){
    const cont = document.getElementById('emlab-auth-widget-inner');
    if (!cont) return;
    if (user){
      cont.innerHTML = '<span>' + user.email + '</span>' +
        '<button onclick="emlabLogout()">Cerrar sesión</button>';
    } else {
      cont.innerHTML = '<button onclick="emlabOpenModal(false)">Ingresar</button>';
    }
  }

  onAuthStateChanged(window.emlabAuth, function(user){
    window.emlabAuthUser = user || null;
    emlabAsegurarWidget(15);
    pintarWidget(user);
    window.dispatchEvent(new CustomEvent('emlab-auth-cambio', { detail: { user: user } }));
  });
</script>
